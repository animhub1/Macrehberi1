/* ===== Modern tema katmanı ===== */
:root{--bg:#f4f6fb;--card:#ffffff;--tx:#0f172a;--mut:#64748b;--bd:#e5e9f1;--ac:#e11d48;--ac2:#f97316;--sh:0 1px 2px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.06);--r:16px}

/* ===== Maç sekmeleri: kaydırma konumu korunur, aktif sekme görünür kalır ===== */
(function(){let TS=0;
 document.addEventListener("scroll",e=>{const t=e.target;if(t&&t.classList&&t.classList.contains("tabs"))TS=t.scrollLeft},true);
 document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest(".tabs .tb");if(b&&b.dataset.t){const t=b.parentNode;TS=t.scrollLeft}},true);
 function fix(t){if(t.dataset.fx)return;t.dataset.fx="1";t.scrollLeft=TS;
  const on=t.querySelector(".tb.on");if(!on)return;
  const l=on.offsetLeft,r=l+on.offsetWidth,v0=t.scrollLeft,v1=v0+t.clientWidth;
  if(l<v0+16||r>v1-16){t.scrollTo({left:Math.max(0,l-(t.clientWidth-on.offsetWidth)/2),behavior:"smooth"})}}
 const mo=new MutationObserver(()=>{document.querySelectorAll(".tabs:not([data-fx])").forEach(fix)});
 mo.observe(document.getElementById("app"),{childList:true,subtree:true});
 const oo=window.openMatch;if(typeof oo==="function"){window.openMatch=function(){TS=0;return oo.apply(this,arguments)}}
})();

/* ===== Maç sekmeleri: içerikte sağa/sola kaydırarak sekme değiştir ===== */
(function(){let sx=0,sy=0,st=0,ok=false;
 function hs(el,root){for(;el&&el!==root&&el!==document.body;el=el.parentElement){
  if(el.classList&&el.classList.contains("tabs"))return false;

  if((cs.overflowX==="auto"||cs.overflowX==="scroll")&&el.scrollWidth>el.clientWidth+4)return true;

  return false}

  const t=e.touches[0];ok=false;if(e.touches.length!==1)return;
  const z=e.target.closest&&e.target.closest(".pn,.tabs");if(!z){return}
